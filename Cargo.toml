[package]
name = "neura"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
description = "Read-only federated SQL engine built on DataFusion and Arrow"

[features]
default = []
# Optional inbound compatibility endpoint. PostgreSQL source reads always work.
postgres-wire = ["dep:pgwire"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
async-stream = "0.3"
axum = "0.8"
bytes = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive", "env"] }
datafusion = { version = "=53.1.0", features = ["parquet", "sql", "unicode_expressions"] }
datafusion-federation = { version = "=0.5.3", features = ["sql"] }
futures = "0.3"
iceberg = "=0.10.1"
iceberg-datafusion = "=0.10.1"
aws-config = "=1.8.18"
aws-sdk-glue = { version = "=1.153.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
iceberg-storage-opendal = { version = "=0.10.1", features = ["opendal-s3", "opendal-fs"] }
native-tls = "0.2"
object_store = { version = "0.13", features = ["aws"] }
pgwire = { version = "=0.40.7", optional = true }
postgres-native-tls = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["full"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1"] }
tokio-util = { version = "0.7", features = ["rt", "io"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

[profile.release]
lto = false
codegen-units = 16
strip = "debuginfo"
