# Pull a published private image. This file never builds from local source.
name: neura
services:
  neura:
    image: ${NEURA_IMAGE:-ghcr.io/kritikmodi/neura:0.1.0-alpha.1}
    pull_policy: always
    ports: ["127.0.0.1:8080:8080"]
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 2
    tmpfs: ["/tmp:size=64m,mode=1777"]
    volumes:
      - "${NEURA_CONFIG:?Set NEURA_CONFIG to your config file}:/etc/neura/neura.toml:ro"
      - "spill:/var/lib/neura/spill"
    env_file: ["${NEURA_ENV_FILE:?Set NEURA_ENV_FILE to a protected environment file}"]
    restart: unless-stopped
volumes:
  spill:
