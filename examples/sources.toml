# Replace dataset identifiers and snapshots. Values below are examples, not fixtures.
[limits]
memory_mb=512
max_concurrent_queries=4
partitions=2
max_spill_mb=4096
sort_merge_reservation_mb=16
# Row-group pruning stays enabled. Enable row-level late materialization when it
# saves enough decoding/bytes to offset extra remote column-range requests.
parquet_row_filter_pushdown=false
spill_dir="/var/lib/neura/spill"
[server]
# Container listeners must sit behind a TLS proxy, on a private network.
http_addr="0.0.0.0:8080"
allow_insecure_network=true
[[sources]]
name="pg"
kind="postgres"
dsn_env="NEURA_POSTGRES_DSN"
[[sources.tables]]
name="customers"
remote="public.customers"
columns=[{name="id",data_type="int64"},{name="region",data_type="utf8"}]
[[sources]]
name="lake"
kind="s3"
bucket="replace-me"
region="us-east-1"
governance="iam_only"
[[sources.tables]]
name="orders"
files=[{path="immutable/orders/part-000.parquet",etag='"replace-with-head-object-etag"'}]
[[sources]]
name="glue"
kind="glue"
warehouse="s3://replace-me/warehouse"
region="us-east-1"
governance="iam_only"
[[sources.tables]]
name="events"
remote="analytics.events"
# snapshot_id = 123456789 # Omit to pin current metadata once per query.
[[sources]]
name="dbx"
kind="databricks"
host="https://replace-me.cloud.databricks.com"
warehouse_id="replace-me"
token_env="DATABRICKS_TOKEN"
[[sources.tables]]
name="events"
remote="main.analytics.events"
snapshot="42"
columns=[{name="id",data_type="int64"},{name="amount",data_type="decimal(18,2)"}]
[[sources]]
name="snow"
kind="snowflake"
host="https://replace-me.snowflakecomputing.com"
warehouse="ANALYTICS_WH"
database="ANALYTICS"
schema="PUBLIC"
role="NEURA_READER"
token_env="SNOWFLAKE_TOKEN"
[[sources.tables]]
name="events"
remote="ANALYTICS.PUBLIC.EVENTS"
snapshot="2026-09-28T00:00:00Z"
columns=[{name="ID",data_type="int64"},{name="AMOUNT",data_type="decimal(18,2)"}]
[[sources]]
name="bq"
kind="bigquery"
project="replace-me"
location="US"
token_env="BIGQUERY_TOKEN"
maximum_bytes_billed=1000000000
[[sources.tables]]
name="events"
remote="replace_me.analytics.events"
snapshot="2026-09-28T00:00:00Z"
columns=[{name="id",data_type="int64"},{name="amount",data_type="decimal(18,2)"}]
