name: Rust and real local integrations
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust and Python tooling
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component clippy,rustfmt
          python3 -m venv .venv
          .venv/bin/pip install uv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libssl-dev
      - name: Static checks and unit tests
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test --all-targets
      - name: Actual PostgreSQL and S3-compatible integration
        run: bash scripts/integration.sh
      - name: Actual Iceberg snapshots and deletes
        run: |
          uv run --with 'pyiceberg[sql-sqlite]==0.10.0' --with pyarrow==21.0.0 scripts/iceberg_fixture.py
          uv run --with 'pyiceberg[sql-sqlite]==0.10.0' --with pyarrow==21.0.0 scripts/iceberg_delete_fixture.py
          cargo test --test iceberg -- --include-ignored
      - name: Stop this job's fixtures
        if: always()
        run: docker compose -f deploy/compose.test.yml down
