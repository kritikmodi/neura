name: Private Docker release
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-docker-release
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Require private repository/package and a new version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          python3 scripts/release-privacy.py
          python3 - <<'PY'
          import os, re, subprocess, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('Cargo.toml').read_text())['package']['version']
          assert re.fullmatch(r'\d+\.\d+\.\d+-alpha\.\d+', version), 'This publisher only creates alpha releases'
          refs = subprocess.check_output(['gh', 'api', f'repos/{os.environ["GITHUB_REPOSITORY"]}/git/matching-refs/tags/v{version}'], text=True)
          import json
          assert not any(r['ref'] == 'refs/tags/v' + version for r in json.loads(refs)), 'Version already tagged; bump Cargo.toml and Cargo.lock'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('version=' + version + '\n')
          PY

  validation:
    needs: metadata
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  build:
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
      IMAGE: ghcr.io/kritikmodi/neura
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify private destination
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release-privacy.py
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # Staging tags stay private. Versioned release tags are created only after
      # all unit/integration tests and both native architecture smoke tests pass.
      - name: Build and stage Neura image
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ghcr.io/kritikmodi/neura:build-${{ github.sha }}-${{ matrix.arch }}
          cache-from: |
            type=gha,scope=neura-${{ matrix.arch }}
            type=gha,scope=neura-${{ matrix.arch }}-cube
            type=gha,scope=neura-${{ matrix.arch }}-core
          cache-to: type=gha,scope=neura-${{ matrix.arch }},mode=max
          build-args: |
            CARGO_BUILD_JOBS=2
            CARGO_FEATURES=postgres-wire
            NEURA_VERSION=${{ env.VERSION }}
            NEURA_REVISION=${{ github.sha }}
          provenance: mode=min
          sbom: true
      - name: Verify staged image is private
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release-privacy.py --require-package --tag "build-$GITHUB_SHA-$ARCH"
      - name: Prepare disposable integration sources
        run: |
          mkdir -p data
          python3 -m venv .venv
          .venv/bin/pip install uv==0.8.22
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          docker compose -f deploy/compose.test.yml up -d --wait postgres s3
          .venv/bin/uv run --with pyarrow==21.0.0 --with boto3==1.40.40 scripts/seed.py
          npm install --prefix target/cube-test --no-audit --no-fund @cubejs-backend/postgres-driver@1.6.57 pg@8.16.3
      - name: Test the same image with the PG listener disabled and enabled
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          docker pull "$IMAGE@$DIGEST"
          source scripts/test-env.sh
          python3 scripts/release-smoke.py "$IMAGE@$DIGEST" "$VERSION"
          python3 scripts/release-smoke.py "$IMAGE@$DIGEST" "$VERSION" --pg-listener
      - name: Record validated digest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release-privacy.py --require-package --tag "build-$GITHUB_SHA-$ARCH"
          mkdir -p release-digests
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          Path('release-digests/' + os.environ['ARCH'] + '.json').write_text(json.dumps({
              'arch': os.environ['ARCH'], 'version': os.environ['VERSION'], 'commit': os.environ['GITHUB_SHA'],
              'digest': os.environ['IMAGE_DIGEST']}, indent=2))
          PYTHON
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digests-${{ matrix.arch }}
          path: release-digests/*.json
          if-no-files-found: error
          retention-days: 7
      - name: Stop only this job's fixtures
        if: always()
        run: docker compose -f deploy/compose.test.yml down

  publish:
    needs: [metadata, validation, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.metadata.outputs.version }}
      IMAGE: ghcr.io/kritikmodi/neura
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: digests-*
          path: release-digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish verified architecture indexes and private prerelease
        run: python3 scripts/release-publish.py
